<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Türksat</title>
<style>
  :root { --bg:#0D1B2A; --panel:rgba(8,18,30,.94); --row:#16293d; --accent:#e63b7a; --txt:#f2f5f8; --dim:#9fb0c2; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#000; color:var(--txt); overflow:hidden; cursor:none;
    font-family:system-ui,"Segoe UI",Arial,sans-serif; }
  body.mouse { cursor:default; }
  #frame { position:fixed; inset:0; width:100%; height:100%; border:0; background:#000; display:none; pointer-events:none; }
  video { position:fixed; inset:0; width:100%; height:100%; background:#000; object-fit:contain; }

  /* Liste des chaînes (touche OK) */
  #panel { position:fixed; top:0; bottom:0; left:0; width:min(460px,45vw); background:var(--panel);
    transform:translateX(-102%); transition:transform .18s ease-out; display:flex; flex-direction:column; z-index:5; }
  #panel.open { transform:none; }
  #panel h1 { margin:0; padding:22px 24px 12px; font-size:28px; }
  #rows { flex:1; overflow-y:auto; padding:6px 16px; scrollbar-width:none; }
  #rows::-webkit-scrollbar { display:none; }
  .row { display:flex; align-items:center; gap:16px; height:68px; padding:0 18px; margin:0 0 8px; font-size:28px;
    background:var(--row); border:4px solid transparent; border-radius:12px; cursor:pointer; }
  .row .n { width:44px; color:var(--dim); text-align:right; }
  .row .t { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .tag { font-size:18px; color:var(--dim); }
  .row .live { color:var(--accent); font-size:22px; }
  .row.sel { border-color:var(--accent); background:#24405c; }
  #hint { padding:12px 24px 18px; font-size:19px; color:var(--dim); }

  /* Bandeau d'info (zapping) */
  #banner { position:fixed; left:5vw; right:5vw; bottom:5vh; display:flex; align-items:center; gap:24px; padding:20px 28px;
    background:var(--panel); border-left:8px solid var(--accent); border-radius:14px; opacity:0; transform:translateY(12px);
    transition:opacity .25s, transform .25s; z-index:4; }
  #banner.show { opacity:1; transform:none; }
  #bnum { font-size:56px; font-weight:700; color:var(--accent); min-width:90px; }
  #bname { font-size:40px; font-weight:600; flex:1; }
  #bsub { font-size:22px; color:var(--dim); }
  #clock { font-size:34px; }

  /* Saisie d'un numéro, volume, messages */
  #digits { position:fixed; top:4vh; right:4vw; font-size:80px; font-weight:700; color:var(--accent);
    text-shadow:0 3px 12px #000; z-index:6; display:none; }
  #vol { position:fixed; top:4vh; left:50%; transform:translateX(-50%); padding:12px 26px; font-size:30px; background:var(--panel);
    border-radius:12px; z-index:6; opacity:0; transition:opacity .2s; }
  #vol.show { opacity:1; }
  #msg { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    text-align:center; padding:0 8vw; font-size:36px; z-index:3; background:radial-gradient(circle at 50% 40%, #16293d, var(--bg)); }
  #msg.show { display:flex; }
  #msg .big { font-size:64px; font-weight:700; }
  #msg .btn { margin-top:10px; padding:16px 34px; font-size:30px; border-radius:12px; background:var(--accent); color:#fff; border:0; cursor:pointer; }
  #msg small { font-size:22px; color:var(--dim); }
  #spin { position:fixed; top:50%; left:50%; width:70px; height:70px; margin:-35px; border:8px solid #fff3; border-top-color:var(--accent);
    border-radius:50%; animation:r 1s linear infinite; display:none; z-index:3; }
  @keyframes r { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<iframe id="frame" allow="autoplay; fullscreen; encrypted-media" tabindex="-1" title="Lecteur officiel"></iframe>
<video id="v" autoplay playsinline></video>
<div id="spin"></div>
<div id="msg"></div>

<div id="banner"><div id="bnum"></div><div><div id="bname"></div><div id="bsub"></div></div><div style="flex:1"></div><div id="clock"></div></div>
<div id="digits"></div>
<div id="vol"></div>

<nav id="panel" aria-label="Liste des chaînes">
  <h1>📺 Chaînes</h1>
  <div id="rows"></div>
  <div id="hint">↑ ↓ choisir &nbsp;·&nbsp; OK regarder &nbsp;·&nbsp; Retour fermer</div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
/* ---------------------------------------------------------------
   CHAÎNES — à modifier librement.
   url  : flux direct (.m3u8) à lire dans l'appli.
   frame: page de direct officielle affichée dans l'appli (lecteur de la chaîne).
   site : chaîne qui interdit l'intégration — OK ouvre son site officiel.
---------------------------------------------------------------- */
const CHANNELS = [
  { name: "TRT 1",        url: "https://tv-trt1.medya.trt.com.tr/master.m3u8" },
  { name: "TRT Haber",    url: "https://tv-trthaber.medya.trt.com.tr/master.m3u8" },
  { name: "TRT Spor",     url: "https://tv-trtspor.medya.trt.com.tr/master.m3u8" },
  { name: "TRT Çocuk",    url: "https://tv-trtcocuk.medya.trt.com.tr/master.m3u8" },
  { name: "TRT Belgesel", url: "https://tv-trtbelgesel.medya.trt.com.tr/master.m3u8" },
  { name: "TRT World",    url: "https://tv-trtworld.medya.trt.com.tr/master.m3u8" },
  { name: "ATV",          frame: "https://www.atv.com.tr/canli-yayin" },
  { name: "Show TV",      site: "https://www.showtv.com.tr/canli-yayin" },
  { name: "NOW",          frame: "https://www.nowtv.com.tr/canli-yayin" },
];

const list = window.__CHANNELS__ || CHANNELS;      // __CHANNELS__ : réservé aux tests
const $ = id => document.getElementById(id);
const frameEl = $('frame'), v = $('v'), panel = $('panel'), rows = $('rows'), msg = $('msg'), banner = $('banner'), vol = $('vol'), digits = $('digits'), spin = $('spin');
function store(k, val){ try { if (val === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(val)); } catch(e){ return null; } }

let cur = -1, prev = -1, sel = 0, hls = null, retry = 0, retryTimer = null, bannerTimer, listTimer, volTimer, digTimer, buf = '';
v.volume = typeof store('vol') === 'number' ? store('vol') : 1;

/* ----- Liste ----- */
list.forEach((c, i) => {
  const r = document.createElement('div');
  r.className = 'row';
  r.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="t"></span><span class="tag"></span><span class="live"></span>';
  r.querySelector('.t').textContent = c.name;
  r.querySelector('.tag').textContent = c.url ? '' : c.frame ? 'lecteur officiel' : 'site officiel';
  r.onclick = () => { sel = i; paintList(); choose(); };
  r.onmousemove = () => { if (sel !== i) { sel = i; paintList(); } };
  rows.appendChild(r);
});
function paintList(){
  [...rows.children].forEach((r, i) => {
    r.classList.toggle('sel', i === sel);
    r.querySelector('.live').textContent = i === cur ? '● en cours' : '';
  });
  rows.children[sel].scrollIntoView({ block: 'nearest' });
}
const listOpen = () => panel.classList.contains('open');
function openList(){ sel = Math.max(cur, 0); banner.classList.remove('show'); panel.classList.add('open'); paintList(); keepList(); }
function closeList(){ panel.classList.remove('open'); clearTimeout(listTimer); }
function keepList(){ clearTimeout(listTimer); listTimer = setTimeout(closeList, 10000); }
function choose(){ closeList(); play(sel); }

/* ----- Bandeau ----- */
function clock(){ return new Date().toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }); }
function showBanner(extra){
  const c = list[cur];
  $('bnum').textContent = cur + 1; $('bname').textContent = c.name;
  $('bsub').textContent = extra || (c.url ? 'OK : liste des chaînes' : 'Site officiel — OK pour ouvrir');
  $('clock').textContent = clock();
  banner.classList.add('show'); clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => banner.classList.remove('show'), 4000);
}
setInterval(() => { if (banner.classList.contains('show')) $('clock').textContent = clock(); }, 20000);

/* ----- Lecture ----- */
function setMsg(html){ msg.innerHTML = html || ''; msg.classList.toggle('show', !!html); }
function stop(){
  clearTimeout(retryTimer);
  if (hls) { hls.destroy(); hls = null; }
  v.removeAttribute('src'); v.load();
  frameEl.src = 'about:blank'; frameEl.style.display = 'none';
}
function play(i, silent){
  i = (i + list.length) % list.length;
  if (i !== cur) prev = cur;
  cur = i; retry = 0; store('last', cur);
  const c = list[cur];
  paintList(); stop();
  if (c.frame) {                                  // lecteur officiel de la chaîne, intégré
    spin.style.display = 'none'; setMsg('');
    frameEl.style.display = 'block'; frameEl.src = c.frame;
    showBanner('Lecteur officiel de la chaîne');
    return;
  }
  if (!c.url) {                                   // chaîne sans flux libre : écran d'accueil du site
    spin.style.display = 'none';
    setMsg('<div class="big">' + esc(c.name) + '</div><div>Cette chaîne ne diffuse pas de flux libre.</div>' +
           '<button class="btn" id="go">OK — ouvrir le site officiel</button><small>Le site s’ouvre dans un nouvel onglet</small>');
    showBanner();
    return;
  }
  setMsg(''); spin.style.display = 'block'; showBanner('Chargement…');
  load(c);
}
const esc = s => s.replace(/[&<>"]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[m]));

function load(c){
  const myCur = cur;
  v.onplaying = () => { retry = 0; spin.style.display = 'none'; setMsg(''); if (banner.classList.contains('show')) $('bsub').textContent = 'OK : liste des chaînes'; };
  v.onwaiting = () => { spin.style.display = 'block'; };
  v.oncanplay = () => { spin.style.display = 'none'; };
  if (/\.m3u8/.test(c.url) && window.Hls && Hls.isSupported()) {
    hls = new Hls({ maxBufferLength: 30, liveSyncDurationCount: 4, manifestLoadingMaxRetry: 6, levelLoadingMaxRetry: 6, fragLoadingMaxRetry: 6 });
    hls.loadSource(c.url); hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
      recover(myCur);
    });
  } else {
    v.src = c.url;                                 // lecture native (Safari, Smart TV, mp4)
    v.onerror = () => recover(myCur);
  }
  v.play().catch(() => { spin.style.display = 'none'; setMsg('<div class="big">▶</div><div>Appuyez sur OK pour lancer la lecture</div>'); });
}
/* Reprise automatique : on retente en silence (image figée) avant d'afficher une erreur */
function recover(forCur){
  if (forCur !== cur) return;
  if (retry >= 6) {
    spin.style.display = 'none';
    setMsg('<div class="big">⚠️</div><div>Impossible de lire « ' + esc(list[cur].name) + ' »</div><small>Flux indisponible ou adresse changée. OK pour réessayer.</small>');
    return;
  }
  retry++; spin.style.display = 'block';
  const c = list[cur]; stop();
  retryTimer = setTimeout(() => forCur === cur && load(c), Math.min(2000 * retry, 10000));
}

/* ----- Volume ----- */
function volume(d){
  v.muted = false; v.volume = Math.min(1, Math.max(0, Math.round((v.volume + d) * 20) / 20)); store('vol', v.volume);
  vol.textContent = v.volume === 0 ? '🔇 Muet' : '🔊 ' + Math.round(v.volume * 100) + ' %';
  vol.classList.add('show'); clearTimeout(volTimer); volTimer = setTimeout(() => vol.classList.remove('show'), 1500);
}

/* ----- Télécommande / clavier ----- */
function okPressed(){
  if (msg.classList.contains('show')) {
    const c = list[cur];
    if (c && !c.url) { window.open(c.site, '_blank', 'noopener'); return; }
    if (retry >= 6) { play(cur); return; }
    v.play().then(() => setMsg('')).catch(() => {}); return;
  }
  if (listOpen()) choose(); else openList();
}
const BACK = ['Escape', 'Backspace', 'BrowserBack', 'GoBack', 'XF86Back'];
document.addEventListener('keydown', e => {
  document.body.classList.remove('mouse');
  const k = e.key, code = e.keyCode;
  if (BACK.includes(k) || code === 10009 || code === 461) { if (listOpen()) { closeList(); e.preventDefault(); } return; }
  if (/^[0-9]$/.test(k)) {                          // numéro de chaîne (0 = chaîne précédente)
    if (k === '0' && !buf) { if (prev >= 0) play(prev); return; }
    buf += k; digits.textContent = buf; digits.style.display = 'block'; clearTimeout(digTimer);
    const go = () => { const n = parseInt(buf, 10) - 1; buf = ''; digits.style.display = 'none'; if (n >= 0 && n < list.length) play(n); };
    if (buf.length >= String(list.length).length) go(); else digTimer = setTimeout(go, 1600);
    return;
  }
  switch (k) {
    case 'Enter': case ' ': case 'MediaPlayPause': e.preventDefault(); okPressed(); break;
    case 'ArrowDown': e.preventDefault(); if (listOpen()) { sel = (sel + 1) % list.length; paintList(); keepList(); } else play(cur + 1); break;
    case 'ArrowUp':   e.preventDefault(); if (listOpen()) { sel = (sel - 1 + list.length) % list.length; paintList(); keepList(); } else play(cur - 1); break;
    case 'PageDown': case 'ChannelDown': e.preventDefault(); play(cur + 1); break;
    case 'PageUp': case 'ChannelUp':     e.preventDefault(); play(cur - 1); break;
    case 'ArrowRight': e.preventDefault(); if (!listOpen()) volume(+0.05); break;
    case 'ArrowLeft':  e.preventDefault(); if (!listOpen()) volume(-0.05); break;
    case 'i': case 'I': case 'Info': showBanner(); break;
    case 'm': case 'M': v.muted = !v.muted; vol.textContent = v.muted ? '🔇 Muet' : '🔊 Son'; vol.classList.add('show'); clearTimeout(volTimer); volTimer = setTimeout(() => vol.classList.remove('show'), 1500); break;
    case 'f': case 'F': (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}); break;
  }
});
document.addEventListener('mousemove', () => document.body.classList.add('mouse'));
msg.addEventListener('click', okPressed);
v.addEventListener('click', () => { listOpen() ? closeList() : openList(); });

/* ----- Démarrage ----- */
const last = store('last');
play(typeof last === 'number' && last >= 0 && last < list.length ? last : 0);
setTimeout(() => { if (!listOpen()) { openList(); } }, 600);   // au premier lancement : liste ouverte
</script>
</body>
</html>
