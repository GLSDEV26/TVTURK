<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Türksat – chaînes turques en direct</title>
<style>
  :root { --bg:#0D1B2A; --card:#16293d; --accent:#e63b7a; --txt:#f2f5f8; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font-family: system-ui, "Segoe UI", Arial, sans-serif; overflow:hidden; }
  #app { display:flex; height:100%; }
  #list { width:28%; min-width:260px; max-width:420px; overflow-y:auto; padding:16px; background:#0a1521; }
  #list h1 { font-size:1.3rem; margin:0 0 12px; }
  .ch { display:block; width:100%; text-align:left; padding:14px 16px; margin:0 0 8px; font-size:1.2rem;
    background:var(--card); color:var(--txt); border:3px solid transparent; border-radius:10px; cursor:pointer; }
  .ch:focus, .ch:hover { outline:none; border-color:var(--accent); }
  .ch.on { background:#24405c; }
  #stage { flex:1; position:relative; background:#000; }
  video { width:100%; height:100%; background:#000; }
  #msg { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center;
    font-size:1.4rem; padding:0 24px; pointer-events:none; text-shadow:0 2px 8px #000; }
  #bar { position:absolute; left:16px; top:12px; background:rgba(0,0,0,.6); padding:8px 14px; border-radius:8px;
    font-size:1.2rem; transition:opacity .4s; }
  #add { margin-top:14px; font-size:.95rem; }
  #add input { width:100%; padding:8px; margin:4px 0; border-radius:6px; border:1px solid #345; background:#0D1B2A; color:#fff; }
  #add button { padding:8px 12px; border-radius:6px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  small { opacity:.7; }
  @media (max-width:700px){ #app{flex-direction:column-reverse} #list{width:100%;max-width:none;height:38%} }
</style>
</head>
<body>
<div id="app">
  <nav id="list" aria-label="Chaînes">
    <h1>📺 TV Türksat</h1>
    <div id="buttons"></div>
    <div id="add">
      <small>Ajouter une chaîne (lien .m3u8 officiel) :</small>
      <input id="addName" placeholder="Nom de la chaîne">
      <input id="addUrl" placeholder="https://…/master.m3u8">
      <button id="addBtn">Ajouter</button>
    </div>
  </nav>
  <main id="stage">
    <video id="v" autoplay playsinline controls></video>
    <div id="bar"></div>
    <div id="msg"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
/* ---------------------------------------------------------------
   LISTE DES CHAÎNES — à modifier librement.
   Flux officiels gratuits de la TRT (diffuseur public turc).
   Si une chaîne ne démarre pas, son adresse a peut-être changé :
   récupère la nouvelle sur le site officiel de la chaîne.
---------------------------------------------------------------- */
const CHANNELS = [
  { name: "TRT 1",       url: "https://tv-trt1.medya.trt.com.tr/master.m3u8" },
  { name: "TRT Haber",   url: "https://tv-trthaber.medya.trt.com.tr/master.m3u8" },
  { name: "TRT Spor",    url: "https://tv-trtspor.medya.trt.com.tr/master.m3u8" },
  { name: "TRT Çocuk",   url: "https://tv-trtcocuk.medya.trt.com.tr/master.m3u8" },
  { name: "TRT Belgesel",url: "https://tv-trtbelgesel.medya.trt.com.tr/master.m3u8" },
  { name: "TRT World",   url: "https://tv-trtworld.medya.trt.com.tr/master.m3u8" },
];

const $ = id => document.getElementById(id);
const v = $('v'), msg = $('msg'), bar = $('bar'), box = $('buttons');
let hls = null, cur = -1, barTimer;

function store(k, val){ try { if (val === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(val)); } catch(e){ return null; } }
const custom = store('custom') || [];
const all = () => CHANNELS.concat(custom);

function render(){
  box.innerHTML = '';
  all().forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'ch' + (i === cur ? ' on' : '');
    b.textContent = (i + 1) + '.  ' + c.name;
    b.onclick = () => play(i);
    box.appendChild(b);
  });
}

function showBar(t){ bar.textContent = t; bar.style.opacity = 1; clearTimeout(barTimer); barTimer = setTimeout(() => bar.style.opacity = 0, 3500); }

function play(i){
  const list = all(); if (!list.length) return;
  cur = (i + list.length) % list.length;
  const c = list[cur];
  store('last', cur); render(); showBar(c.name);
  msg.textContent = 'Chargement…';
  if (hls) { hls.destroy(); hls = null; }
  const ok = () => msg.textContent = '';
  const fail = () => msg.textContent = '⚠️ Impossible de lire « ' + c.name + ' ». Flux indisponible ou adresse changée.';
  v.onplaying = ok;
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ lowLatencyMode: false });
    hls.loadSource(c.url); hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) fail(); });
    v.play().catch(()=>{});
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {   // Safari, certaines Smart TV
    v.src = c.url; v.onerror = fail; v.play().catch(()=>{});
  } else fail();
}

// Télécommande / clavier : ↑↓ ou chiffres pour changer de chaîne, F = plein écran
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'PageUp' || e.key === 'ChannelUp')   play(cur - 1);
  else if (e.key === 'PageDown' || e.key === 'ChannelDown') play(cur + 1);
  else if (/^[1-9]$/.test(e.key) && all()[+e.key - 1]) play(+e.key - 1);
  else if (e.key === 'f' || e.key === 'F') (document.fullscreenElement ? document.exitFullscreen() : $('stage').requestFullscreen()).catch(()=>{});
  else if (e.key === 'ArrowDown' && e.target.classList.contains('ch') && e.target.nextElementSibling) { e.target.nextElementSibling.focus(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' && e.target.classList.contains('ch') && e.target.previousElementSibling) { e.target.previousElementSibling.focus(); e.preventDefault(); }
});

$('addBtn').onclick = () => {
  const name = $('addName').value.trim(), url = $('addUrl').value.trim();
  if (!name || !/^https:\/\/.+/.test(url)) { alert('Nom + lien https requis.'); return; }
  custom.push({ name, url }); store('custom', custom);
  $('addName').value = $('addUrl').value = ''; render(); play(all().length - 1);
};

render();
const last = store('last');
play(typeof last === 'number' && last < all().length ? last : 0);
</script>
</body>
</html>
